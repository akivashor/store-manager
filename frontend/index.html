<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store Manager</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#3b82f6"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Login Screen -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 rounded-2xl p-8 w-full max-w-sm shadow-xl">
      <h1 class="text-2xl font-bold text-blue-400 mb-2 text-center">Store Manager</h1>
      <form id="login-form" class="space-y-4">
        <input id="email" type="email" placeholder="Email" required
          class="w-full bg-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <input id="password" type="password" placeholder="Password" required
          class="w-full bg-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg px-4 py-3 font-semibold transition">Login</button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden pb-20">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
      <div>
        <h1 class="font-bold text-blue-400">Store Manager</h1>
        <p id="cashier-info" class="text-xs text-slate-400"></p>
      </div>
      <div class="flex items-center gap-3">
        <select id="currency-select" onchange="setCurrency(this.value)"
          class="bg-slate-700 text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="$">$ USD</option>
          <option value="₪">₪ NIS</option>
          <option value="€">€ EUR</option>
          <option value="£">£ GBP</option>
        </select>
        <button onclick="logout()" class="text-slate-400 hover:text-white text-sm">Logout</button>
      </div>
    </header>

    <!-- Nav Tabs -->
    <nav class="bg-slate-800 border-b border-slate-700 flex sticky top-14 z-10">
      <button onclick="showTab('pos')" id="tab-pos" class="tab-btn flex-1 py-3 text-sm font-medium text-blue-400 border-b-2 border-blue-400">POS</button>
      <button onclick="showTab('products')" id="tab-products" class="tab-btn flex-1 py-3 text-sm font-medium text-slate-400">Products</button>
      <button onclick="showTab('stock')" id="tab-stock" class="tab-btn flex-1 py-3 text-sm font-medium text-slate-400">Stock</button>
      <button onclick="showTab('sales')" id="tab-sales" class="tab-btn flex-1 py-3 text-sm font-medium text-slate-400">Sales</button>
    </nav>

    <!-- POS Tab -->
    <div id="tab-content-pos" class="p-4 space-y-4">
      <div id="cart" class="space-y-2"></div>
      <div id="cart-total" class="hidden bg-slate-800 rounded-xl p-4">
        <div class="flex justify-between text-lg font-bold mb-3">
          <span>Total</span><span id="total-amount" class="text-green-400"></span>
        </div>
        <button onclick="submitSale()" class="w-full bg-green-600 hover:bg-green-500 rounded-lg py-3 font-semibold transition">Complete Sale</button>
        <button onclick="clearCart()" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 rounded-lg py-2 text-sm transition">Clear</button>
      </div>
      <div id="product-list-pos" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- Products Tab -->
    <div id="tab-content-products" class="p-4 hidden space-y-3">

      <!-- Add / Edit Product Form (admin only, hidden by default) -->
      <div id="add-product-form" class="hidden bg-slate-800 rounded-2xl p-5 space-y-3">
        <h2 id="form-title" class="font-semibold text-blue-400">New Product</h2>
        <input id="np-name" type="text" placeholder="Product name *"
          class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <input id="np-price" type="number" step="0.01" min="0" placeholder="Price *"
          class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <input id="np-category" type="text" placeholder="Category"
          class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <input id="np-barcode" type="text" placeholder="Barcode (leave empty for auto SKU)"
          class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="text-xs text-slate-400 mb-1 block">Initial stock</label>
            <input id="np-stock" type="number" min="0" value="0"
              class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div class="flex-1">
            <label class="text-xs text-slate-400 mb-1 block">Min stock (alert)</label>
            <input id="np-min-stock" type="number" min="0" value="5"
              class="w-full bg-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-2 block">Color (optional)</label>
          <div id="color-picker" class="flex flex-wrap gap-2"></div>
          <input id="np-color" type="hidden" value=""/>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-2 block">Photo (optional)</label>
          <label class="flex items-center gap-3 cursor-pointer bg-slate-700 rounded-lg px-4 py-2.5 hover:bg-slate-600 transition">
            <span class="text-sm text-slate-300">Choose image</span>
            <input id="np-photo" type="file" accept="image/*" class="hidden" onchange="previewPhoto(this)"/>
          </label>
          <img id="np-photo-preview" src="" alt="" class="hidden mt-2 rounded-lg w-full object-contain max-h-48"/>
        </div>
        <p id="np-error" class="text-red-400 text-sm hidden"></p>
        <!-- Duplicate name conflict actions -->
        <div id="np-conflict" class="hidden space-y-2">
          <p class="text-amber-400 text-sm">A product with this name already exists.</p>
          <div class="flex gap-2">
            <button onclick="editExistingProduct()" class="flex-1 bg-amber-600 hover:bg-amber-500 rounded-lg py-2 text-sm font-semibold transition">Edit existing</button>
            <button onclick="overwriteProduct()" class="flex-1 bg-red-700 hover:bg-red-600 rounded-lg py-2 text-sm font-semibold transition">Overwrite</button>
          </div>
        </div>
        <input id="np-editing-id" type="hidden" value=""/>
        <input id="np-conflict-id" type="hidden" value=""/>
        <div class="flex gap-3">
          <button onclick="submitAddProduct()" id="np-save-btn" class="flex-1 bg-green-600 hover:bg-green-500 rounded-lg py-2.5 font-semibold transition">Save</button>
          <button onclick="cancelForm()" class="flex-1 bg-slate-700 hover:bg-slate-600 rounded-lg py-2.5 text-sm transition">Cancel</button>
        </div>
      </div>

      <div id="product-list" class="space-y-3"></div>

      <!-- Inactive products (admin only) -->
      <div id="inactive-section" class="hidden">
        <button onclick="toggleInactive()" class="w-full text-slate-500 hover:text-slate-300 text-sm py-2 border border-slate-700 rounded-xl transition">
          Show deactivated products
        </button>
        <div id="inactive-list" class="hidden mt-3 space-y-3"></div>
      </div>
    </div>

    <!-- Stock Tab -->
    <div id="tab-content-stock" class="p-4 hidden">
      <div id="low-stock-alert" class="hidden mb-4 bg-red-900/50 border border-red-500 rounded-xl p-4">
        <p class="font-semibold text-red-400 mb-2">Low Stock Items</p>
        <div id="low-stock-list" class="space-y-1 text-sm"></div>
      </div>
      <div id="stock-list" class="space-y-3"></div>
    </div>

    <!-- Sales Tab -->
    <div id="tab-content-sales" class="p-4 hidden">
      <div id="sales-list" class="space-y-3"></div>
    </div>

    <!-- Floating Add Product button (admin only) -->
    <button id="fab-add" onclick="openAddForm()"
      class="hidden fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-500 rounded-full text-2xl shadow-lg z-20 transition">
      +
    </button>
  </div>

  <!-- Name conflict dialog is inline in the form above -->

  <script src="/static/js/app.js"></script>
</body>
</html>
